meta:
  title: "Stress Test — Viele Trigger"
  difficulty: hard
  duration_minutes: 5
  language: de
  tags: [stress, cooldown, concurrent]
  description: >
    5 Trigger in kurzer Folge. Testet Cooldown-Mechanismus
    und ob der Agent nicht durcheinander kommt.

participants:
  - name: "Davi"
  - name: "Max"

segments:
  - t: 0
    who: "Max"
    says: "Ich hab drei Bugs gefunden im Payment Service."

  - t: 10
    who: "Davi"
    says: "Nilo, notier das bitte."

  - t: 12
    who: "Davi"
    says: "Nilo, was fuer Bugs waren das nochmal?"

  - t: 14
    who: "Davi"
    says: "Nilo, kannst du das aufschreiben?"

  - t: 30
    who: "Max"
    says: "Der erste Bug war ein Race Condition beim Checkout."

  - t: 45
    who: "Davi"
    says: "Nilo, fass das mal zusammen."

  - t: 47
    who: "Davi"
    says: "Nilo, schreib das auch in den Chat bitte."

expect:
  - type: trigger
    after_segment: 1
    reason: "Erster 'Nilo' Trigger"

  - type: quick_ack
    after_segment: 1
    max_latency_ms: 5000

  - type: no_action
    after_segment: 2
    reason: "Cooldown — zweiter Trigger innerhalb 5s ignoriert"

  - type: no_action
    after_segment: 3
    reason: "Cooldown — dritter Trigger innerhalb 5s ignoriert"

  - type: trigger
    after_segment: 5
    reason: "Neuer Trigger nach Cooldown (>5s)"
