meta:
  title: "API Migration Diskussion"
  difficulty: medium
  duration_minutes: 10
  language: de
  tags: [planning, deep-agent, search, state-update]
  description: >
    Laengere Diskussion ueber API v2 Migration mit mehreren Teilnehmern.
    Testet Deep Agent State-Updates, Transcript-Suche, und intelligente Antworten.

participants:
  - name: "Davi"
  - name: "Max"
  - name: "Lisa"

segments:
  - t: 0
    who: "Davi"
    says: "Ok, lasst uns anfangen. Thema heute ist die API Migration auf v2."

  - t: 15
    who: "Max"
    says: "Meine groesste Sorge ist dass die v2 API breaking changes hat und wir alle Clients updaten muessen."

  - t: 30
    who: "Lisa"
    says: "Das stimmt, aber wir koennten Feature Flags nutzen. Dann koennen wir schrittweise migrieren ohne alles auf einmal zu aendern."

  - t: 50
    who: "Davi"
    says: "Gute Idee. Max, was denkst du dazu?"

  - t: 60
    who: "Max"
    says: "Feature Flags sind ok, aber wir brauchen trotzdem einen Migrationsplan. Ich wuerde sagen wir fangen mit den internen Services an und machen die externen Clients zum Schluss."

  - t: 80
    who: "Lisa"
    says: "Einverstanden. Ich kann bis Mittwoch einen Rollout-Plan erstellen."

  - t: 95
    who: "Davi"
    says: "Perfekt. Max, kannst du einen Feature Flag POC machen bis Freitag?"

  - t: 105
    who: "Max"
    says: "Ja, mach ich. Brauche aber Zugang zum Staging Environment."

  - t: 120
    who: "Davi"
    says: "Nilo, was hat Max vorhin zu den Breaking Changes gesagt?"

  - t: 180
    who: "Davi"
    says: "Nilo, fass mal zusammen was wir bisher besprochen haben und welche Action Items es gibt."

expect:
  - type: trigger
    after_segment: 8
    reason: "keyword 'Nilo' bei Frage zu Breaking Changes"

  - type: quick_ack
    after_segment: 8
    max_latency_ms: 5000

  - type: state_updated
    field: context_summary
    contains_any: ["API", "Migration", "v2"]

  - type: state_updated
    field: action_items
    min_count: 1

  - type: trigger
    after_segment: 9
    reason: "keyword 'Nilo' bei Zusammenfassungs-Anfrage"

  # Deep Agent responds either via chat OR by updating state — both are correct
  - type: state_updated
    field: context_summary
    contains_any: ["Breaking", "Feature", "Migration", "API"]

  - type: no_action
    before_segment: 8
    reason: "Keine Trigger vor Segment 8"
